<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="Arial, Helvetica, sans-serif">
  <title>Figure 1. How Periapt turns an advisory into a ranked, explained decision</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
  </defs>
  <style>
    .box   { stroke: #6b6b6b; stroke-width: 1.2; rx: 8; }
    .plain { fill: #f2f2f2; }
    .ai    { fill: #dce9f8; stroke: #2f6db5; }
    .human { fill: #fde7cf; stroke: #c46a12; }
    .out   { fill: #e1f2e1; stroke: #3b8a3b; }
    .t     { font-size: 12.5px; font-weight: bold; fill: #1a1a1a; text-anchor: middle; }
    .s     { font-size: 10.5px; fill: #333; text-anchor: middle; }
    .edge  { stroke: #4a4a4a; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
    .loop  { stroke: #4a4a4a; stroke-width: 1.3; fill: none; stroke-dasharray: 5 3; marker-end: url(#arr); }
    .note  { font-size: 10.5px; font-style: italic; fill: #2f6db5; }
    .lnote { font-size: 10.5px; font-style: italic; fill: #4a4a4a; }
    .leg   { font-size: 10px; fill: #333; }
  </style>

  <!-- Row 1: left to right -->
  <rect class="box plain" x="10"  y="12" width="190" height="54"/>
  <text class="t" x="105" y="36">New advisory</text>
  <text class="s" x="105" y="53">CVE entry or prose bulletin</text>

  <rect class="box ai" x="245" y="12" width="190" height="54"/>
  <text class="t" x="340" y="36">LLM agent</text>
  <text class="s" x="340" y="53">reads, matches, orchestrates</text>

  <rect class="box plain" x="480" y="12" width="190" height="54"/>
  <text class="t" x="575" y="36">1. Exposure</text>
  <text class="s" x="575" y="53">cited parts-list line + reach map</text>

  <path class="edge" d="M200,39 L243,39"/>
  <path class="edge" d="M435,39 L478,39"/>
  <path class="edge" d="M575,66 L575,110"/>

  <!-- Row 2: right to left -->
  <rect class="box plain" x="480" y="112" width="190" height="54"/>
  <text class="t" x="575" y="136">2. Likelihood</text>
  <text class="s" x="575" y="153">CVSS · EPSS · SPARTA (reused)</text>

  <rect class="box ai" x="245" y="112" width="190" height="54"/>
  <text class="t" x="340" y="136">3. Mission impact</text>
  <text class="s" x="340" y="153">world model: what-if, per satellite</text>

  <rect class="box out" x="10" y="112" width="190" height="54"/>
  <text class="t" x="105" y="136">Ranked list</text>
  <text class="s" x="105" y="153">likelihood × impact, with reasons</text>

  <path class="edge" d="M480,139 L437,139"/>
  <path class="edge" d="M245,139 L202,139"/>
  <path class="edge" d="M105,166 L105,210"/>

  <!-- Notes in the band between rows 2 and 3 -->
  <text class="note" x="122" y="186">Authority rule: AI can raise a priority; lowering needs a human;</text>
  <text class="note" x="122" y="199">outside the model's data = high</text>
  <text class="lnote" x="563" y="199" text-anchor="end">re-rank on news, overrides</text>

  <!-- Row 3: left to right -->
  <rect class="box ai" x="10" y="212" width="190" height="54"/>
  <text class="t" x="105" y="236">Per-team briefs</text>
  <text class="s" x="105" y="253">why · what · when, per team</text>

  <rect class="box human" x="245" y="212" width="190" height="54"/>
  <text class="t" x="340" y="236">Human decides</text>
  <text class="s" x="340" y="253">override any time · approve first</text>

  <rect class="box plain" x="480" y="212" width="190" height="54"/>
  <text class="t" x="575" y="236">Team acts</text>
  <text class="s" x="575" y="253">outcome stored in the record</text>

  <path class="edge" d="M200,239 L243,239"/>
  <path class="edge" d="M435,239 L478,239"/>
  <!-- Loop back: outcome re-ranks the list -->
  <path class="loop" d="M575,212 L575,168"/>

  <!-- Legend -->
  <rect x="10"  y="280" width="12" height="10" fill="#dce9f8" stroke="#2f6db5"/>
  <text class="leg" x="27"  y="289">AI</text>
  <rect x="55"  y="280" width="12" height="10" fill="#fde7cf" stroke="#c46a12"/>
  <text class="leg" x="72"  y="289">human decision</text>
  <rect x="160" y="280" width="12" height="10" fill="#e1f2e1" stroke="#3b8a3b"/>
  <text class="leg" x="177" y="289">output</text>
  <rect x="225" y="280" width="12" height="10" fill="#f2f2f2" stroke="#6b6b6b"/>
  <text class="leg" x="242" y="289">existing tools / plain software</text>
</svg>
